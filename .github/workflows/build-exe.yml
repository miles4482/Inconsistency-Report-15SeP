name: Build ParameterAudit EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "ParameterAudit.spec"
      - "LicenseGenerator.spec"
      - "requirements.txt"
      - "build_exe.*"
      - "How_to_use.txt"
      - "app_folders/**"

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and build folder app
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm LicenseGenerator.spec
          python -m PyInstaller --noconfirm ParameterAudit.spec
      - uses: actions/upload-artifact@v4
        with:
          name: ParameterAudit-windows-folder
          path: dist/ParameterAudit
      - uses: actions/upload-artifact@v4
        with:
          name: LicenseGenerator-windows-folder
          path: dist/LicenseGenerator
